<!doctype html>

<html lang="en">
  
    <head>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="styles.css">

    </head>

    <body>

        <div id="header">
            <h1>Happy Birthday!</h1>
            <img id="profile-img" src="profile_blue_jpg.jpg" alt="Profile Picture">
            <h2 id="age">19 Years Old</h2>
            <h4 id="date">26 August 2026</h4>
        </div>

        <div class="gift-section">
            <h2 class="gift-title">I am happy for you</h2>
            <h3 class="gift-description">Here's a special gift just for you!</h3>
            <div class="gift-img" id="gift-love"></div>
        </div>

        <div class="gift-section">
            <h2 class="gift-title">67</h2>
            <div class="gift-img" id="gift-67"></div>
        </div>

        <div class="gift-section">
            <h2 class="gift-title">For You</h2>
            <div class="gift-img" id="gift-thanks"></div>
        </div>

        <p id="footer">Click this <a href="https://www.youtube.com/" target="_blank">link</a> to see more surprises!</p>
        
    </body>

</html>
