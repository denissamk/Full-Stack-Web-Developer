<!DOCTYPE html>

<html lang="en">
  
    <head>
        <link rel="stylesheet" href="styles.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Happy+Monkey&display=swap" rel="stylesheet">
    </head>

    <body>

        <div id="header">
            <h1>Happy Birthday!</h1>
            <img id="profile-img" src="./images/profile_blue_jpg.jpg" alt="Profile Picture">
            <h2 id="age">19 Years Old</h2>
            <h4 id="date">26 August 2026</h4>
        </div>

        <div class="gift-section">
            <h2 class="gift-title">I'm happy for you</h2>
            <h3 class="gift-hint">(Hover over the gift)</h3>
            <div class="gift-img" id="gift-img-happy"></div>
        </div>

        <div class="gift-section">
            <h2 class="gift-title">You're really beautiful</h2>
            <div class="gift-img" id="gift-img-beautiful"></div>
        </div>

        <div class="gift-section">
            <h2 class="gift-title">Wish you all the best!</h2>
            <div class="gift-img" id="gift-img-WYATB"></div>
        </div>

        <p id="footer">I hope you're happy, please take <a href="#" target="_blank">this surprise</a> from me</p>

    </body>

</html>
